# Canonical mypy configuration for this repo (petrosa_k8s#1052 epic /
# petrosa-data-manager#290). mypy reads mypy.ini before pyproject.toml's
# [tool.mypy] section when both are present, so this file always wins; the
# duplicate block that used to live in pyproject.toml was dead config and
# has been removed there.
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
strict_optional = True
exclude = ^build/

[mypy-nats.*]
ignore_missing_imports = True

[mypy-motor.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True
